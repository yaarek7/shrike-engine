[package]
name = "chess-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "An experimental chess engine built for correctness-first, measurable development"

[dependencies]

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

